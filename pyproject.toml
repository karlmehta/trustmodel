[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "trustmodel"
version = "0.1.0"
description = "Score any AI for trust in 30 seconds. Open-source eval, monitoring, and governance across 10 trust dimensions — no API key required."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Karl Mehta", email = "karl@trustmodel.ai" }]
keywords = [
    "ai", "ai-safety", "trust", "evaluation", "guardrails", "bias",
    "fairness", "compliance", "llm", "responsible-ai", "observability", "mcp",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
openai = ["openai>=1.0"]
anthropic = ["anthropic>=0.30"]
telemetry = ["opentelemetry-sdk>=1.20", "opentelemetry-api>=1.20"]
cloud = ["requests>=2.28"]
mcp = ["mcp>=1.2"]
all = ["openai>=1.0", "anthropic>=0.30", "opentelemetry-sdk>=1.20", "opentelemetry-api>=1.20", "requests>=2.28", "mcp>=1.2"]
dev = ["pytest>=7.0", "ruff>=0.4"]

[project.urls]
Homepage = "https://trustmodel.ai"
Documentation = "https://trustmodel.ai/wiki"
Repository = "https://github.com/karlmehta/trustmodel"
Demo = "https://huggingface.co/spaces/karlmehta/trustmodel-score-any-ai"

[project.scripts]
trustmodel = "trustmodel.cli:main"
trustmodel-mcp = "trustmodel.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/trustmodel"]

[tool.ruff]
line-length = 100
