name: Publish to PyPI

# Deploy trustmodel-local to PyPI when a GitHub Release is published.
# Auth: PYPI_API_TOKEN repo secret (a token scoped to the owner's personal PyPI
# account, which holds the `trustmodel-local` project — NOT the pdxlab `trustmodel`
# full SDK). To switch to Trusted Publishing later, drop `with: password` and add
# `permissions: id-token: write` + a PyPI trusted-publisher for this workflow.

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Verify wheel metadata (name + version)
        run: ls -l dist/ && python -m pip install --upgrade twine && twine check dist/*
      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
